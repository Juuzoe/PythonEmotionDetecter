[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affectlab"
version = "2.0.1"
description = "Real-time affective computing from a webcam: FACS action units, dimensional affect, contactless heart rate and blink dynamics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Maksym Gavrylenko" }]
keywords = [
  "affective computing",
  "emotion recognition",
  "facial action coding system",
  "action units",
  "valence arousal",
  "remote photoplethysmography",
  "rppg",
  "heart rate",
  "blink detection",
  "psychophysiology",
  "mediapipe",
  "opencv",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-contrib-python>=4.8",
  "mediapipe>=0.10.14",
  "onnxruntime>=1.16",
]

[project.optional-dependencies]
deepface = ["deepface>=0.0.93", "tf-keras"]
report = ["matplotlib>=3.7"]
all = ["affectlab[deepface,report]"]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "mypy>=1.8",
  "matplotlib>=3.7",
]

[project.scripts]
affectlab = "affectlab.cli:main"

[project.urls]
Homepage = "https://github.com/Juuzoe/PythonEmotionDetecter"
Repository = "https://github.com/Juuzoe/PythonEmotionDetecter"
Issues = "https://github.com/Juuzoe/PythonEmotionDetecter/issues"
Changelog = "https://github.com/Juuzoe/PythonEmotionDetecter/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
affectlab = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# No python_version pin: mypy follows the running interpreter, so the numpy 2.5
# stubs (which use the 3.12 "type" statement) parse on 3.12+ and the 3.10 runners
# use the older numpy that still supports them.
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: needs downloaded models, native libraries or a camera (deselected in CI)",
]
filterwarnings = [
  "ignore::DeprecationWarning:google.protobuf",
]
